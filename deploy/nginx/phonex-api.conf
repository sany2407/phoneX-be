# PhoneX API — nginx reverse proxy.
#
# __DOMAIN__ is replaced by deploy/ec2-setup.sh. Certbot rewrites this file to
# add the TLS listener and the HTTP->HTTPS redirect once you have a cert.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Product art and mockups are uploaded through this API (express.json
    # allows 10mb), so leave headroom above that for multipart overhead.
    client_max_body_size 25m;

    # Long enough for report-style endpoints, short enough to fail fast.
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Websocket/upgrade passthrough (harmless for a plain REST API).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
