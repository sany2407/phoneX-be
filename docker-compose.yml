# Production stack for the PhoneX API on a single EC2 instance.
#
# The container applies pending migrations on boot (see the CMD in the
# Dockerfile), so a plain `docker compose up -d --build` is a full deploy.
services:
  api:
    build:
      context: .
    image: phonex-api:dev
    container_name: phonex-api
    restart: unless-stopped
    init: true

    env_file:
      - .env
    environment:
      # The image is built to listen on 8080; pin it here so the nginx
      # upstream never has to change when the host .env differs.
      PORT: "8080"
      NODE_ENV: production

    ports:
      # Loopback only — nginx is the single public entry point.
      - "127.0.0.1:8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
